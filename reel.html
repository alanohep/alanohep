<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alan Ohep — Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808;
      --text: #f0ede8;
      --muted: #888;
      --border: #1a1a1a;
      --font: 'Space Grotesk', system-ui, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.75rem 2.5rem;
    }
    .nav-name { font-size: 0.85rem; font-weight: 400; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      font-size: 0.85rem;
      color: var(--muted);
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .video-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 70px;
      background: #000;
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-name">Alan Ohep</a>
    <div class="nav-links">
      <a href="index.html#works">Work</a>
      <a href="index.html#film">Film</a>
      <a href="reel.html" class="active">Reel</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </nav>
  <div class="video-wrap">
    <iframe
      src="https://player.vimeo.com/video/1229205260?autoplay=1&title=0&byline=0&portrait=0&color=ffffff"
      frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
